<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>렌더링 테스트 · 도면자동화 v0.1</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="features.css">
</head>
<body>
  <header class="topbar">
    <div><strong>도면자동화 v0.1</strong><span>CAD 렌더러 단독 테스트</span></div>
    <nav class="main-nav">
      <a href="index.html">도면 비교</a>
      <a href="review.html">문서 기반 검토</a>
      <a href="convert.html">DWG → DXF 변환</a>
      <a href="render-test.html" class="active">렌더링 테스트</a>
    </nav>
    <div></div>
  </header>

  <main class="render-test-main">
    <section class="page-intro render-test-intro">
      <div>
        <h1>DWG/DXF 렌더링 테스트</h1>
        <p>비교 분석 없이 mlightcad와 LibreDWG 렌더러의 파일 호환성과 로딩 성능만 확인합니다.</p>
      </div>
      <div class="render-test-actions">
        <button id="renderFitBtn" class="secondary" disabled>전체 보기</button>
        <button id="renderReloadBtn" class="secondary" disabled>다시 렌더링</button>
      </div>
    </section>

    <section class="render-test-upload panel">
      <label class="render-file-picker">
        <input id="renderFile" type="file" accept=".dwg,.dxf">
        <span class="converter-icon">CAD</span>
        <span><b>DWG 또는 DXF 파일 선택</b><small>파일은 서버에 업로드되지 않고 브라우저에서 처리됩니다.</small></span>
      </label>
      <dl class="render-metrics">
        <div><dt>파일</dt><dd id="renderFileName">선택되지 않음</dd></div>
        <div><dt>형식</dt><dd id="renderFormat">-</dd></div>
        <div><dt>크기</dt><dd id="renderSize">-</dd></div>
        <div><dt>로딩 시간</dt><dd id="renderDuration">-</dd></div>
      </dl>
    </section>

    <section class="render-test-stage panel">
      <div class="render-stage-head">
        <h2>렌더링 화면</h2>
        <span id="renderStatus" class="render-status waiting">렌더러를 준비하고 있습니다…</span>
      </div>
      <iframe id="renderFrame" class="render-test-frame" src="/cad-frame.html?runtime=20260831-2&mode=test" allow="unload" title="DWG 및 DXF 렌더링 테스트"></iframe>
    </section>
  </main>
  <script type="module" src="render-test.js"></script>
</body>
</html>
